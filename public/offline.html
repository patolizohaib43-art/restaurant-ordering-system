<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>You're offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #111827;
      background: #f9fafb;
    }
    h1 { font-size: 18px; margin: 0; }
    p { font-size: 14px; color: #6b7280; margin: 0; max-width: 320px; }
    button {
      margin-top: 8px;
      height: 44px;
      padding: 0 24px;
      border-radius: 9999px;
      border: none;
      background: #ea580c;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>You are offline</h1>
  <p>Please reconnect to the internet to browse the menu and place an order.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
